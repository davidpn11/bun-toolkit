name: Publish beta

# Run it on a branch: Actions → Publish beta → Run workflow, or `gh workflow run beta.yml --ref <branch>`.
on:
  workflow_dispatch:

concurrency:
  group: publish-beta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      channel: beta
