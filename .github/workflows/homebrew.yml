name: Homebrew formula

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write the formula for, such as v0.1.0 or v0.2.0-beta.1
        type: string
        required: true

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Write the formula
        id: formula
        run: |
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          path=$(bun scripts/homebrew-formula.ts \
            --version "${TAG#v}" \
            --repo "$GITHUB_REPOSITORY" \
            --assets "$RUNNER_TEMP/assets.json" \
            --sums "$RUNNER_TEMP/SHA256SUMS" \
            --out tap/Formula)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          cat "$path"
      - name: Commit the formula to the default branch
        working-directory: tap
        env:
          FORMULA: ${{ steps.formula.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMULA#tap/}"
          git diff --cached --quiet && exit 0
          git commit -m "$(basename "$FORMULA" .rb) ${TAG#v} formula"
          git push
