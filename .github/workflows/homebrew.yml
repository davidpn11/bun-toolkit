name: Homebrew formula

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write the formula for, such as v0.1.0
        type: string
        required: true

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  formula:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Write the formula
        run: |
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          private=""
          if [ "$(gh repo view --json isPrivate --jq .isPrivate)" = "true" ]; then private="--private"; fi
          mkdir -p tap/Formula
          bun scripts/homebrew-formula.ts \
            --version "${TAG#v}" \
            --repo "$GITHUB_REPOSITORY" \
            --assets "$RUNNER_TEMP/assets.json" \
            --sums "$RUNNER_TEMP/SHA256SUMS" \
            $private \
            > tap/Formula/bun-toolkit.rb
          cat tap/Formula/bun-toolkit.rb
      - name: Commit the formula to the default branch
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bun-toolkit.rb
          git diff --cached --quiet && exit 0
          git commit -m "bun-toolkit ${TAG#v} formula"
          git push
