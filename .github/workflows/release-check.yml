name: Release check

on:
  pull_request:
    branches: [master]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: What merging releases
        run: bun scripts/release-check.ts master
